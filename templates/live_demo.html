<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live VR Body Detection Demo</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-cube me-2"></i>VR Body Analyzer
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">
                    <i class="fas fa-upload me-1"></i>Upload Video
                </a>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-lg-8">
                <div class="card shadow">
                    <div class="card-header bg-gradient text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-video me-2"></i>Live Body Part Detection
                        </h4>
                    </div>
                    <div class="card-body text-center">
                        <div class="video-container">
                            <img id="videoFeed" src="{{ url_for('video_feed') }}" 
                                 class="img-fluid rounded shadow"
                                 alt="Live video feed">
                            <div class="video-overlay">
                                <div class="fps-counter" id="fpsCounter">FPS: --</div>
                            </div>
                        </div>
                        
                        <div class="mt-3">
                            <button class="btn btn-success" id="startBtn" onclick="startDetection()">
                                <i class="fas fa-play me-2"></i>Start Detection
                            </button>
                            <button class="btn btn-danger" id="stopBtn" onclick="stopDetection()" style="display: none;">
                                <i class="fas fa-stop me-2"></i>Stop Detection
                            </button>
                            <button class="btn btn-primary" onclick="captureFrame()">
                                <i class="fas fa-camera me-2"></i>Capture Frame
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card shadow">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0">
                            <i class="fas fa-chart-bar me-2"></i>Real-time Stats
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="stat-item">
                            <div class="stat-label">Detection Confidence</div>
                            <div class="progress mb-2">
                                <div class="progress-bar bg-success" id="confidenceBar" 
                                     role="progressbar" style="width: 0%"></div>
                            </div>
                            <small class="text-muted" id="confidenceText">0%</small>
                        </div>

                        <div class="stat-item mt-3">
                            <div class="stat-label">Processing FPS</div>
                            <h4 class="text-primary" id="processingFps">--</h4>
                        </div>

                        <div class="stat-item mt-3">
                            <div class="stat-label">Active Body Parts</div>
                            <div id="activeBodyParts">
                                <span class="badge bg-secondary me-1">Head</span>
                                <span class="badge bg-secondary me-1">Torso</span>
                                <span class="badge bg-secondary me-1">Arms</span>
                                <span class="badge bg-secondary me-1">Legs</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card shadow mt-3">
                    <div class="card-header bg-warning text-dark">
                        <h5 class="mb-0">
                            <i class="fas fa-cogs me-2"></i>Detection Settings
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="confidenceThreshold" class="form-label">
                                Confidence Threshold: <span id="thresholdValue">0.5</span>
                            </label>
                            <input type="range" class="form-range" id="confidenceThreshold" 
                                   min="0.1" max="0.9" step="0.1" value="0.5"
                                   onchange="updateThreshold(this.value)">
                        </div>

                        <div class="mb-3">
                            <label for="detectionMode" class="form-label">Detection Mode</label>
                            <select class="form-select" id="detectionMode" onchange="changeDetectionMode()">
                                <option value="tensorrt">TensorRT (GPU)</option>
                                <option value="mediapipe">MediaPipe (CPU)</option>
                                <option value="auto">Auto Select</option>
                            </select>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="showLandmarks" checked
                                   onchange="toggleLandmarks()">
                            <label class="form-check-label" for="showLandmarks">
                                Show Landmarks
                            </label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="showConnections" checked
                                   onchange="toggleConnections()">
                            <label class="form-check-label" for="showConnections">
                                Show Connections
                            </label>
                        </div>
                    </div>
                </div>

                <div class="card shadow mt-3">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">
                            <i class="fas fa-download me-2"></i>Export Options
                        </h5>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-outline-primary btn-sm w-100 mb-2" onclick="startRecording()">
                            <i class="fas fa-record-vinyl me-2"></i>Start Recording
                        </button>
                        <button class="btn btn-outline-success btn-sm w-100 mb-2" onclick="exportLandmarks()">
                            <i class="fas fa-file-export me-2"></i>Export Landmarks
                        </button>
                        <button class="btn btn-outline-info btn-sm w-100" onclick="generateReport()">
                            <i class="fas fa-file-alt me-2"></i>Generate Report
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Capture Modal -->
    <div class="modal fade" id="captureModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Captured Frame Analysis</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-8">
                            <canvas id="capturedFrame" class="img-fluid"></canvas>
                        </div>
                        <div class="col-md-4">
                            <h6>Detected Landmarks:</h6>
                            <div id="landmarksList" class="small">
                                <!-- Landmarks will be populated here -->
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" onclick="saveCapturedFrame()">
                        <i class="fas fa-save me-2"></i>Save Frame
                    </button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/live_demo.js') }}"></script>
</body>
</html>
